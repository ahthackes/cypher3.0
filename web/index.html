<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cypher 2.0 — Local Defense Console</title>
<style>
  :root{
    --bg:        #0b0f14;
    --panel:     #11161d;
    --panel-2:   #161c25;
    --line:      #232b36;
    --text:      #d7dee6;
    --text-dim:  #7c8798;
    --info:      #3b4a5a;
    --low:       #4f7cff;
    --medium:    #e8b339;
    --high:      #f0883e;
    --critical:  #ef4b4b;
    --accent:    #45d9c0;
    --font-ui:   ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif;
    --font-mono: ui-monospace, "SF Mono", "Cascadia Code", Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html,body{ height:100%; margin:0; }
  body{
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-ui);
    font-size: 14px;
  }
  /* ---------- login screen ---------- */
  #login-screen{
    height:100%; display:flex; align-items:center; justify-content:center;
    background:
      radial-gradient(circle at 20% 20%, rgba(69,217,192,0.06), transparent 40%),
      var(--bg);
  }
  #login-box{
    width: 320px; padding: 32px 28px; background: var(--panel);
    border: 1px solid var(--line); border-radius: 4px;
  }
  #login-box h1{
    font-family: var(--font-mono); font-size: 18px; font-weight: 600;
    margin: 0 0 4px 0; color: var(--text);
  }
  #login-box p.sub{ color: var(--text-dim); margin: 0 0 20px 0; font-size: 13px; }
  #login-box input{
    width:100%; padding: 10px 12px; margin-bottom: 10px;
    background: var(--bg); border: 1px solid var(--line); border-radius: 3px;
    color: var(--text); font-family: var(--font-mono); font-size: 13px;
  }
  #login-box input:focus{ outline: none; border-color: var(--accent); }
  #login-box button{
    width:100%; padding: 10px 12px; margin-top: 6px;
    background: var(--accent); color: #06201b; border: none; border-radius: 3px;
    font-weight: 600; font-family: var(--font-ui); cursor: pointer; font-size: 13px;
  }
  #login-box button:hover{ filter: brightness(1.08); }
  #login-error{ color: var(--critical); font-size: 12px; margin-top: 8px; min-height: 16px; }

  /* ---------- app shell ---------- */
  #app{ display:none; height:100%; flex-direction: column; }
  header{
    display:flex; align-items:center; justify-content:space-between;
    padding: 10px 18px; border-bottom: 1px solid var(--line); background: var(--panel);
  }
  header .brand{ display:flex; align-items:center; gap:10px; }
  header .brand .dot{ width:8px; height:8px; border-radius:50%; background: var(--accent); }
  header .brand span{ font-family: var(--font-mono); font-weight:600; letter-spacing: 0.02em; }
  header .status{ display:flex; gap:18px; font-family: var(--font-mono); font-size:12px; color: var(--text-dim); }
  header .status b{ color: var(--text); font-weight:600; }
  header button.logout{
    background:none; border:1px solid var(--line); color: var(--text-dim);
    padding:6px 10px; border-radius:3px; cursor:pointer; font-size:12px;
  }

  main{
    flex: 1; display:grid; gap:1px; background: var(--line);
    grid-template-columns: 1.2fr 1fr; grid-template-rows: 1fr 1fr;
    overflow:hidden;
  }
  .panel{ background: var(--panel); display:flex; flex-direction:column; min-height:0; }
  .panel h2{
    margin:0; padding: 10px 14px; font-size:12px; font-weight:600;
    color: var(--text-dim); border-bottom:1px solid var(--line);
  }
  .panel .body{ flex:1; overflow-y:auto; padding: 8px 10px; }

  #feed-panel{ grid-row: 1 / 3; }
  .feed-row{
    display:flex; gap:10px; padding:7px 6px; border-bottom:1px solid var(--line);
    font-family: var(--font-mono); font-size:12px; align-items:baseline;
  }
  .feed-row .sev{
    width:62px; flex-shrink:0; text-align:center; padding:2px 0; border-radius:2px;
    font-size:10px; font-weight:700; letter-spacing:0.03em; text-transform:lowercase;
  }
  .sev-critical{ background: rgba(239,75,75,0.18); color: var(--critical); }
  .sev-high{ background: rgba(240,136,62,0.18); color: var(--high); }
  .sev-medium{ background: rgba(232,179,57,0.18); color: var(--medium); }
  .sev-low{ background: rgba(79,124,255,0.18); color: var(--low); }
  .feed-row .ip{ color: var(--text); width:120px; flex-shrink:0; }
  .feed-row .expl{ color: var(--text-dim); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .feed-row .ts{ color: var(--text-dim); margin-left:auto; flex-shrink:0; }

  #blocks-panel .body{ padding:0; }
  table{ width:100%; border-collapse:collapse; font-family: var(--font-mono); font-size:12px; }
  th{ text-align:left; padding:8px 10px; color: var(--text-dim); font-weight:500; border-bottom:1px solid var(--line); }
  td{ padding:7px 10px; border-bottom:1px solid var(--line); }
  button.unblock{
    background:none; border:1px solid var(--critical); color: var(--critical);
    padding:3px 8px; border-radius:3px; cursor:pointer; font-size:11px;
  }
  button.unblock:hover{ background: rgba(239,75,75,0.12); }
  .empty{ padding: 18px 10px; color: var(--text-dim); font-size:12px; }

  canvas{ max-height: 100%; }
  #chart-panel .body{ padding: 14px; }
</style>
</head>
<body>

<div id="login-screen">
  <div id="login-box">
    <h1>Cypher 2.0</h1>
    <p class="sub">Local defense console — sign in to continue</p>
    <input id="login-user" placeholder="username" autocomplete="username" value="admin">
    <input id="login-pass" placeholder="password" type="password" autocomplete="current-password">
    <button onclick="login()">Sign in</button>
    <div id="login-error"></div>
  </div>
</div>

<div id="app">
  <header>
    <div class="brand"><div class="dot"></div><span>CYPHER 2.0</span></div>
    <div class="status">
      <div>mode <b id="s-mode">—</b></div>
      <div>backend <b id="s-backend">—</b></div>
      <div>model <b id="s-model">—</b></div>
    </div>
    <button class="logout" onclick="logout()">Sign out</button>
  </header>
  <main>
    <section class="panel" id="feed-panel">
      <h2>Live alert feed</h2>
      <div class="body" id="feed-body"><div class="empty">Waiting for events…</div></div>
    </section>
    <section class="panel" id="chart-panel">
      <h2>Alerts by severity (last 50)</h2>
      <div class="body"><canvas id="sev-chart"></canvas></div>
    </section>
    <section class="panel" id="blocks-panel">
      <h2>Active blocks</h2>
      <div class="body">
        <table>
          <thead><tr><th>IP</th><th>Reason</th><th>Expires</th><th></th></tr></thead>
          <tbody id="blocks-body"></tbody>
        </table>
      </div>
    </section>
  </main>
</div>

<script src="/static/vendor/chart.umd.min.js"></script>
<script>
const SEV_COLORS = { critical: '#ef4b4b', high: '#f0883e', medium: '#e8b339', low: '#4f7cff', info: '#4a5768' };

async function api(path, opts={}) {
  const res = await fetch(path, { credentials: 'same-origin', headers: {'Content-Type':'application/json'}, ...opts });
  if (res.status === 401) { showLogin(); throw new Error('unauthorized'); }
  if (!res.ok) throw new Error(await res.text());
  return res.json();
}

function showLogin(){
  document.getElementById('login-screen').style.display = 'flex';
  document.getElementById('app').style.display = 'none';
}
function showApp(){
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app').style.display = 'flex';
  boot();
}

async function login(){
  const username = document.getElementById('login-user').value;
  const password = document.getElementById('login-pass').value;
  const err = document.getElementById('login-error');
  err.textContent = '';
  try {
    await api('/api/login', { method:'POST', body: JSON.stringify({username, password}) });
    showApp();
  } catch(e){
    err.textContent = 'Sign-in failed. Check the admin credentials set up on this server.';
  }
}
async function logout(){
  await fetch('/api/logout', { method:'POST' });
  showLogin();
}

let sevChart;
function initChart(){
  const ctx = document.getElementById('sev-chart');
  sevChart = new Chart(ctx, {
    type: 'bar',
    data: { labels: ['critical','high','medium','low','info'], datasets: [{
      data: [0,0,0,0,0],
      backgroundColor: ['#ef4b4b','#f0883e','#e8b339','#4f7cff','#4a5768'],
      borderRadius: 2,
    }]},
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: {
        x: { ticks: { color: '#7c8798', font: { family: 'ui-monospace' } }, grid: { display: false } },
        y: { ticks: { color: '#7c8798' }, grid: { color: '#232b36' }, beginAtZero: true },
      }
    }
  });
}

function renderFeedRow(a){
  const row = document.createElement('div');
  row.className = 'feed-row';
  row.innerHTML = `
    <div class="sev sev-${a.severity}">${a.severity}</div>
    <div class="ip">${a.src_ip || 'unknown'}</div>
    <div class="expl">${a.explanation || ''}</div>
    <div class="ts">${(a.timestamp || '').slice(11,19)}</div>`;
  return row;
}

async function refreshAlerts(){
  const alerts = await api('/api/alerts?limit=50');
  const feedBody = document.getElementById('feed-body');
  feedBody.innerHTML = '';
  if (alerts.length === 0){
    feedBody.innerHTML = '<div class="empty">No alerts yet. Run `cypher replay` with a sample log to see this live.</div>';
  } else {
    alerts.forEach(a => feedBody.appendChild(renderFeedRow(a)));
  }
  const counts = { critical:0, high:0, medium:0, low:0, info:0 };
  alerts.forEach(a => { if (a.severity in counts) counts[a.severity]++; });
  if (sevChart){
    sevChart.data.datasets[0].data = Object.values(counts);
    sevChart.update();
  }
}

async function refreshBlocks(){
  const blocks = await api('/api/blocks');
  const body = document.getElementById('blocks-body');
  body.innerHTML = '';
  if (blocks.length === 0){
    body.innerHTML = '<tr><td colspan="4" class="empty">No IPs currently blocked.</td></tr>';
    return;
  }
  blocks.forEach(b => {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>${b.src_ip}</td>
      <td>${b.reason || ''}</td>
      <td>${b.expires_at ? b.expires_at.slice(0,19) : 'no expiry'}</td>
      <td><button class="unblock" data-ip="${b.src_ip}">Unblock</button></td>`;
    body.appendChild(tr);
  });
  body.querySelectorAll('button.unblock').forEach(btn => {
    btn.onclick = async () => {
      await api('/api/blocks/unblock', { method:'POST', body: JSON.stringify({ip: btn.dataset.ip, reason:'manual override from dashboard'}) });
      refreshBlocks();
    };
  });
}

async function refreshHealth(){
  const h = await api('/api/health');
  document.getElementById('s-mode').textContent = h.mode;
  document.getElementById('s-backend').textContent = h.backend;
  document.getElementById('s-model').textContent = h.model_loaded ? 'loaded' : 'not trained';
}

function connectWS(){
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  const ws = new WebSocket(`${proto}://${location.host}/ws/live`);
  ws.onmessage = () => { refreshAlerts(); };
  ws.onclose = () => setTimeout(connectWS, 3000);
}

function boot(){
  initChart();
  refreshHealth();
  refreshAlerts();
  refreshBlocks();
  connectWS();
  setInterval(refreshBlocks, 10000);
  setInterval(refreshHealth, 15000);
}

// Try to detect an existing session on page load.
(async () => {
  try { await api('/api/health'); showApp(); } catch(e) { showLogin(); }
})();
</script>
</body>
</html>
