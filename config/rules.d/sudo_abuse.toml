[[rule]]
id = "sudo_failure_repeated"
description = "3 or more failed sudo/su attempts from the same user within 5 minutes"
event_type = "priv_escalation_failure"
service = "sudo"
count_threshold = 3
window_seconds = 300
score = 65

[[rule]]
id = "sudo_not_in_sudoers"
description = "User not in the sudoers file attempted sudo"
event_type = "priv_escalation_failure"
service = "sudo"
match_field = "message"
match_contains = "not in the sudoers file"
score = 85
