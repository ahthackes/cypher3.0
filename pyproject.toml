[project]
name = "cypher"
version = "0.1.0"
description = "Cypher 2.0 — offline local log anomaly detector and active defense system"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "watchdog>=4.0",
    "pandas>=2.2",
    "scikit-learn>=1.4",
    "joblib>=1.3",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "websockets>=12.0",
    "toml>=0.10",
    "python-dateutil>=2.9",
    "bcrypt>=4.1",
    "itsdangerous>=2.2",
    # Windows Event Log access. The marker means pip skips it on Linux/macOS.
    "pywin32>=306; sys_platform == 'win32'",
]

[project.optional-dependencies]
ml = ["onnxruntime>=1.17", "skl2onnx>=1.16"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "httpx>=0.27", "ruff>=0.4"]

[project.scripts]
cypher = "cypher.__main__:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
